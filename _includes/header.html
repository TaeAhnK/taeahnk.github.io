{% assign header = site.data.home.header %}

<header class="site-header">
  <div class="container header-layout">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      {{ header.brand | default: site.title }}
    </a>
    <div class="header-actions">
      <button class="theme-toggle print-hide" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false">
        <span class="theme-toggle-icon" aria-hidden="true"></span>
        <span class="theme-toggle-label">Dark</span>
      </button>
      {% if page.url contains 'print' %}
        <a class="print-nav-link" href="{{ '/' | relative_url }}">Portfolio</a>
      {% else %}
        <a class="print-nav-link" href="{{ '/print.html' | relative_url }}">Print</a>
      {% endif %}
    </div>
  </div>
</header>
